h1,h2,h3,th,nav a,.logo,.big,.stat b,.cap{font-weight:400}
nav a{letter-spacing:.06em}
h2,h3,.logo,th{letter-spacing:.04em}
.big{letter-spacing:.03em}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:22px/1.45 var(--body);letter-spacing:.03em;display:flex;flex-direction:column;min-height:100vh}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#0b0e15;border-bottom:3px solid;border-image:linear-gradient(90deg,var(--red) 50%,var(--blu) 50%) 1}
.bar{max-width:none;margin:auto;display:flex;align-items:center;gap:20px;padding:10px 3vw;flex-wrap:wrap}
.logo{font:700 26px var(--head);letter-spacing:.5px}
.logo b{color:var(--red)}.logo i{color:var(--blu);font-style:normal}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{font:600 17px var(--head);padding:6px 12px;border-radius:4px;color:var(--mute)}
nav a:hover{color:var(--text);background:var(--panel)}
nav a.on{color:#fff;background:var(--panel);box-shadow:inset 0 -3px var(--gold)}
main{width:100%;flex:1;padding:24px 3vw 50px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.1}
h2{font-size:34px;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 22px;max-width:60ch}
.hero{display:grid;grid-template-columns:1fr 1fr;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px;position:relative;min-height:clamp(220px,30vh,320px)}
.hero>div{padding:18px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero .l{background:linear-gradient(135deg,#8f2b2e,#5a1b20)}
.hero .r{background:linear-gradient(135deg,#2f5a7c,#1c364c)}
.hero small{font-size:21px;display:block;color:#f0e6d0;opacity:.85}
.big{font:400 clamp(44px,6vw,104px)/1 var(--head);color:#fff;margin:8px 0;display:flex;align-items:center;gap:.2em;white-space:nowrap;justify-content:center}
.big .ico{width:1.35em;height:1.35em;flex:none;margin-right:.1em}
.unit{font-size:.42em;margin-left:2px;align-self:flex-end;padding-bottom:.3em;opacity:.9}
.hero .l{padding-right:120px}.hero .r{padding-left:120px}
.hero:hover{border-color:var(--gold)}
.live{margin:0 0 14px;font-size:clamp(46px,5.4vw,84px);text-align:center}
.num{display:flex;align-items:flex-start;gap:.08em}
.arr{width:.62em;height:.62em;flex:none;margin-top:.05em;filter:drop-shadow(0 0 3px #000b)}
.arr.up{fill:#3ddc63}.arr.down{fill:#ff5560;transform:scaleY(-1)}.arr.flat{fill:#c9cfdb}
.key{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);color:var(--gold);border:3px solid var(--gold);border-radius:50%;width:160px;height:160px;display:grid;place-items:center;font:700 22px var(--head)}
.meta{color:var(--mute);font-size:19px;margin:0 0 30px}
.meta a{color:var(--gold);text-decoration:underline}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:34px}
.cat{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:6px;padding:16px}
.cat h3{font-size:22px}.cat p{margin:4px 0 0;color:var(--mute);font-size:20px}
.cat:hover{background:#1f2738}
.search{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.search h3{font-size:24px;margin-bottom:4px}
.search input{width:100%;padding:12px 14px;margin:10px 0;background:#0b0e15;border:1px solid var(--line);border-radius:6px;color:var(--text);font:21px var(--body);letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-weight:500;font-size:20px}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.chips.off .chip{opacity:.45;pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;isolation:isolate;overflow:hidden;min-height:200px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:16px;text-shadow:0 1px 3px #000c}
.card::before{content:'';position:absolute;inset:-10px;z-index:-2;background:var(--bg,none) center/cover no-repeat;filter:blur(2.5px) brightness(.5) saturate(.9)}
.card::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(12,15,22,.88),rgba(12,15,22,.35))}
.card:hover{border-color:var(--c)}
.card:hover::before{filter:blur(1.5px) brightness(.68) saturate(1)}
.card h3{font-size:24px}.card p{margin:0;color:#dfe4ee;font-size:22px;flex:1}
.tag{align-self:flex-start;font-size:17px;font-weight:500;color:#fff;background:var(--c);padding:2px 10px;border-radius:999px;margin-top:6px}
.host{font-size:18px;color:#c3cad8}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{font-size:20px;border-collapse:collapse;width:100%;min-width:760px;background:var(--panel)}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 16px var(--head);color:var(--mute);background:#141a26}
td.n{text-align:right;font-variant-numeric:tabular-nums}th.n{text-align:right}
td a{color:var(--gold);text-decoration:underline}
.cap{font-size:16px;background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;margin-left:6px}
.note{background:#241d10;border:1px solid #5b4720;color:#e9d6a4;border-radius:6px;padding:12px 14px;margin:16px 0;font-size:19px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 18px}
.stat b{display:block;font:700 30px var(--head);color:var(--gold)}
footer{text-align:center;color:var(--mute);font-size:17px;padding:0 20px 30px}
.ico{display:inline-block;width:.85em;height:.85em;background:center/contain no-repeat;vertical-align:-.1em}
.ico-k{background-image:var(--ico-k)}.ico-r{background-image:var(--ico-r)}
.logo .ico{width:34px;height:34px;margin-right:6px;vertical-align:middle}
.key .ico{width:104px;height:104px;vertical-align:middle}
.lead{text-align:center;max-width:70ch;margin:0 auto 18px;color:var(--mute);font-size:22px}
.acw{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:4;background:#0b0e15;border:1px solid var(--line);border-radius:6px;margin-top:-6px}
.opt{padding:9px 14px;cursor:pointer}.opt.on,.opt:hover{background:#1f2738;color:var(--gold)}.opt small{color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.row a{color:var(--gold);text-decoration:underline}
.grid{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));grid-auto-rows:1fr;min-height:calc(100vh - 480px)}
.card{justify-content:flex-end;min-height:240px}
.tips{margin-top:26px}.tips h3,.about h3{font-size:26px}
.tips ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;list-style:none;padding:0;margin:10px 0 0}
.tips li{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:14px 16px}
.about{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.about div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}.about p{margin:6px 0 0;color:var(--mute)}
.chart{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.chart h3{font-size:26px;margin-bottom:10px}.chart svg{width:100%;height:auto;display:block;margin-top:10px}
.lg{font:inherit;letter-spacing:inherit;font-size:18px;color:var(--text);background:none;border:2px solid var(--k);border-radius:999px;padding:3px 12px;cursor:pointer}.lg.off{opacity:.4;text-decoration:line-through}
.ln.hide{display:none}.gd{background:#2e8b57}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:14px 0}
.form label{display:flex;flex-direction:column;gap:6px;color:var(--mute)}.form .chk{flex-direction:row;align-items:center;color:var(--text)}
.form select{padding:11px;background:#0b0e15;color:var(--text);border:1px solid var(--line);border-radius:6px;font:20px var(--body)}
.form input[type=search]{margin:0}
@media(max-width:640px){.hero{grid-template-columns:1fr}.key{display:none}.hero .l{padding-right:28px}.hero .r{padding-left:28px}}
@media(prefers-reduced-motion:no-preference){.card,.cat,.chip{transition:background .15s,border-color .15s}}
</style>
</head>

function wmean(vals){
 const a=[...vals].sort((x,y)=>x-y),n=a.length;if(!n)return {mean:null,lo:null,hi:null,k:0};
 const k=n>=3?1:0,lo=a[k],hi=a[n-1-k];
 return {mean:a.map(v=>Math.min(Math.max(v,lo),hi)).reduce((x,y)=>x+y,0)/n,lo,hi,k};
}
function calc(){
 const g=c=>wmean(SOURCES.filter(s=>s.c===c&&s.v!=null).map(s=>s.v)),u=g('usd'),r=g('ref');
 return {u,r,rate:u.mean&&r.mean?u.mean/r.mean:null};
}
const arrow=(now,was)=>{const d=now-was,c=Math.abs(d)<1e-9?'flat':d>0?'up':'down';return `<svg class="arr ${c}" viewBox="0 0 24 24" role="img" aria-label="${c==='flat'?'unchanged':c}"><path d="${c==='flat'?'M4 10h16v4H4z':'M12 3l9 10h-6v8H9v-8H3z'}"/></svg>`};

function ac(inp,box,cb){
 let idx=-1,cur=[];
 const rec=()=>{try{return JSON.parse(localStorage.getItem('tf2hub_recent')||'[]')}catch(e){return[]}};
 const show=()=>{const v=inp.value.trim().toLowerCase();
  const sc=x=>{const l=x.toLowerCase();return(l===v?0:l.startsWith(v)?1:l.includes(' '+v)?2:3)*1000+l.length};
  cur=(v?ITEMS.filter(x=>x.toLowerCase().includes(v)).sort((a,b)=>sc(a)-sc(b)):rec()).slice(0,8);
  idx=-1;box.innerHTML=cur.map((x,i)=>`<div role="option" class="opt" data-i="${i}">${esc(x)}${v?'':' <small>recent</small>'}</div>`).join('');box.hidden=!cur.length};
 const pick=i=>{inp.value=cur[i];box.hidden=true;cb()};
 inp.addEventListener('input',()=>{show();cb()});inp.addEventListener('focus',show);
 inp.addEventListener('blur',()=>setTimeout(()=>box.hidden=true,150));
 inp.addEventListener('keydown',e=>{if(box.hidden)return;const n=cur.length;
  if(e.key==='ArrowDown')idx=(idx+1)%n;else if(e.key==='ArrowUp')idx=(idx-1+n)%n;
  else if(e.key==='Enter'&&idx>=0){pick(idx);e.preventDefault();return}else{if(e.key==='Escape')box.hidden=true;return}
  e.preventDefault();[...box.children].forEach((c,i)=>c.classList.toggle('on',i===idx))});
 box.addEventListener('mousedown',e=>{const o=e.target.closest('.opt');if(o){e.preventDefault();pick(+o.dataset.i)}});
}
const saveRecent=q=>{if(!q)return;try{const r=[q,...JSON.parse(localStorage.getItem('tf2hub_recent')||'[]').filter(x=>x!==q)].slice(0,6);localStorage.setItem('tf2hub_recent',JSON.stringify(r))}catch(e){}};
const shopChips=q=>SHOPS.map(s=>`<a class="chip" href="${s.u.replace('{q}',encodeURIComponent(q))}" ${ext}>${esc(s.n)}</a>`).join('');
function advRun(){
 const g=id=>$('#'+id),it=g('aq').value.trim(),ql=g('aql').value,ks=g('aks').value,au=g('aau').checked;
 const name=[ql!=='Any'&&ql!=='Unique'?ql:'',ks!=='None'?ks:'',au?'Australium':'',g('afe').checked?'Festivized':'',it].filter(Boolean).join(' ');
 g('aprev').textContent=it?name:'Type an item name to build the search.';
 const bp='https://backpack.tf/stats/'+(ql==='Any'?'Unique':ql)+'/'+encodeURIComponent((au?'Australium ':'')+it)+'/'+(g('atr').checked?'Tradable':'Non-Tradable')+'/'+(g('acr').checked?'Craftable':'Non-Craftable');
 g('aout').innerHTML=it?shopChips(name)+`<a class="chip" href="${bp}" ${ext}>backpack.tf stats page (exact match)</a>`:'';
}

function chart(c){
 const list=SOURCES.filter(s=>s.c===c),W=820,H=300,P={l:64,r:16,t:16,b:32},H2=HIST.slice(-DAYS),N=H2.length,T=c==='usd'?'USD sites':'Ref sites';
 const ser=list.map(s=>H2.map(pt=>{const x=ptSrc(s,pt);return x?best(x.b,x.s,x.r):null})),all=ser.flat().filter(v=>v!=null);
 if(!all.length)return `<section class="chart"><h3>${T}: price history</h3><p class="meta">No history yet.</p></section>`;
 const lo=Math.min(...all),hi=Math.max(...all),pd=(hi-lo||hi*.02)*.15,y0=lo-pd,y1=hi+pd;
 const X=i=>N>1?P.l+i*(W-P.l-P.r)/(N-1):P.l+(W-P.l-P.r)/2,Y=v=>P.t+(1-(v-y0)/(y1-y0))*(H-P.t-P.b),f=v=>c==='usd'?'$'+v.toFixed(2):v.toFixed(1);
 const grid=[0,1,2,3].map(k=>{const v=y0+(y1-y0)*k/3;return `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a3345"/><text x="${P.l-8}" y="${Y(v)+5}" text-anchor="end" fill="#9aa3b5" font-size="15">${f(v)}</text>`}).join('');
 const xl=[...new Set([0,N-1])].map(i=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" fill="#9aa3b5" font-size="15">${H2[i].date.slice(5)}</text>`).join('');
 const lines=list.map((s,k)=>{const pts=ser[k].map((v,i)=>v==null?null:[X(i),Y(v),v,i]).filter(Boolean);return `<g class="ln" data-s="${esc(s.n)}" style="color:${COL[k]}">${pts.length>1?`<polyline fill="none" stroke="currentColor" stroke-width="2.5" points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`:''}${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="currentColor"><title>${esc(s.n)} ${H2[p[3]].date}: ${f(p[2])}</title></circle>`).join('')}</g>`}).join('');
 const leg=list.map((s,k)=>`<button class="lg" data-s="${esc(s.n)}" style="--k:${COL[k]}">${esc(s.n)}</button>`).join('');
 return `<section class="chart"><h3>${T}: price history, last ${DAYS} days</h3><div class="chips">${leg}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Key price history">${grid}${xl}${lines}</svg>${N<2?`<p class="meta">History starts ${H2[0].date}. The lines fill in as days pass.</p>`:''}</section>`;

 const cap=(s,st)=>st.k&&s.v!=null&&(s.v<st.lo||s.v>st.hi);
 const conv=(s,v)=>v==null||rate==null?'–':s.c==='usd'?rf(v/rate):usd(v*rate),fmt=(s,v)=>s.c==='usd'?usd(v):rf(v);
 const rows=SOURCES.map(s=>{const st=s.c==='usd'?u:r;return `<tr><td><a href="${s.u}" ${ext}>${esc(s.n)}</a>${s.v==null?'<span class="cap">unavailable</span>':''}${cap(s,st)?'<span class="cap" title="Capped in the average">capped</span>':''}${s.b!=null&&s.b===mx[s.c]?'<span class="cap gd">highest buy</span>':''}${s.s!=null&&s.s===mn[s.c]?'<span class="cap gd">lowest sell</span>':''}<br><small>${esc(s.note)}</small></td>
  <td class="n">${fmt(s,s.b)}</td><td class="n">${fmt(s,s.s)}</td><td class="n">${fmt(s,s.v)}</td><td class="n">${conv(s,s.v)}</td><td>${UPDATED}</td></tr>`}).join('');
 return `<h2>Key prices</h2><p class="sub">The Mann Co. Supply Crate Key on every tracked source. Buy is what a site pays you. Sell is what you pay. Each source measures something slightly different, so read the note under its name. Click a name below a chart to hide or show it.</p>
 <div class="stats"><div class="stat"><b><span class="ico ico-k"></span> ${usd(u.mean)}</b>average, USD sites</div><div class="stat"><b><span class="ico ico-r"></span> ${rf(r.mean)}</b>average, ref sites</div><div class="stat"><b>${rate==null?'–':rate.toFixed(4)}</b>USD per ref (implied)</div></div>
 <div class="tw"><table><thead><tr><th>Source</th><th class="n">Buy</th><th class="n">Sell</th><th class="n">Used in average</th><th class="n">Converted</th><th>Updated</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p class="meta" style="margin-top:14px">USD and ref sources are averaged separately, so nothing is converted before averaging. Each source counts with its sell price, or its buy price if it has no sell, or (backpack.tf) its reference price. With 3 or more sources in a group, the highest and lowest are capped to the next value in (winsorised). With exactly 3 that leaves the middle value, so one expensive source such as Steam cannot drag the average up. Converted uses the implied rate above.</p>
 ${chart('usd')}${chart('ref')}
 <div class="note">History starts on the first day the daily update ran and only contains real readings. A source that was unavailable on a day is left out of that day.</div>`;
}
function cat(k){
 const p=PAGES[k];
 return `<h2>${p.t}</h2><p class="sub">${p.d}</p><div class="grid">${p.items.map(i=>
 `<a class="card" href="${i[1]}" ${ext} style="--c:${p.c}${BG[i[0]]?';--bg:url('+BG[i[0]]+')':''}"><h3>${esc(i[0])}</h3><p>${esc(i[2])}</p><span class="host">${new URL(i[1]).hostname}</span><span class="tag">${esc(i[3])}</span></a>`).join('')}</div>
 <section class="tips"><h3>Good to know</h3><ul>${p.tips.map(t=>`<li>${t}</li>`).join('')}</ul></section>`;
}
function advPage(){
 const o=a=>a.map(x=>`<option>${x}</option>`).join('');
 return `<h2>Advanced search</h2><p class="sub">Build an exact item name, then open it on each shop. Suggestions come from a built-in list of popular items. Any other name works too.</p>
 <div class="form"><label class="acw" style="grid-column:1/-1">Item name<input id="aq" type="search" autocomplete="off" placeholder="e.g. Rocket Launcher"><div id="asug" class="sug" hidden></div></label>
 <label>Quality<select id="aql">${o(['Any','Unique','Strange','Vintage','Genuine','Unusual','Haunted','Collector\'s'])}</select></label>
 <label>Killstreak<select id="aks">${o(['None','Killstreak','Specialized Killstreak','Professional Killstreak'])}</select></label>
 <label class="chk"><input type="checkbox" id="aau">Australium</label><label class="chk"><input type="checkbox" id="afe">Festivized</label>
 <label class="chk"><input type="checkbox" id="atr" checked>Tradable</label><label class="chk"><input type="checkbox" id="acr" checked>Craftable</label></div>
 <section class="search"><h3>Search text</h3><p id="aprev" class="sub" style="margin:4px 0 10px"></p><div class="chips" id="aout"></div></section>
 <p class="meta" style="margin-top:14px">The backpack.tf link uses quality, tradable and craftable. Killstreak tier and Unusual effect only change the text sent to the other shops.</p>`;
}
function route(){
 const k=(location.hash||'#home').slice(1).split('?')[0];
 const cur=PAGES[k]||k==='keys'||k==='search'?k:'home';
 $('#app').innerHTML=cur==='keys'?keys():cur==='search'?advPage():cur==='home'?home():cat(cur);
 document.title=cur==='home'?'Flask TF2 Hub: TF2 mods, tools, shops and key prices':({keys:'Key prices',search:'Advanced search'}[cur]||PAGES[cur].t)+' | Flask TF2 Hub';
 $('#nav').innerHTML=[['home','Home'],['keys','Key prices'],['search','Search'],...Object.entries(PAGES).map(([a,p])=>[a,p.t])]
  .map(([a,t])=>`<a href="#${a}" class="${a===cur?'on':''}">${t}</a>`).join('');
 wire();window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();loadKeys();
</script>
</body>
</html>
