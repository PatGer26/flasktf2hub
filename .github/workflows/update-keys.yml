name: Update TF2 key price

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch key price from backpack.tf
        env:
          BPTF_API_KEY: ${{ secrets.BPTF_API_KEY }}
        run: python3 scripts/update_keys.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keys.json
          git diff --staged --quiet || git commit -m "Update key price" && git push
